<p>Αναζήτησε άρθρα, κατασκευές και σημειώσεις από το πεδίο αναζήτησης στην επάνω μπάρα.</p>
<button id="open-native-search" class="btn btn-outline-primary" type="button">Αναζήτηση άρθρων</button>
<p class="mt-3"><a href="{{ '/archives/' | relative_url }}">Περιήγηση στο αρχείο άρθρων</a></p>
<script>
window.addEventListener('load',()=>{
 const open=()=>{const trigger=document.getElementById('search-trigger');if(getComputedStyle(trigger).display!=='none')trigger.click();document.getElementById('search-input').focus()};
 document.getElementById('open-native-search').addEventListener('click',open);
 const query=new URL(location.href).searchParams.get('q');
 if(query){open();const input=document.getElementById('search-input');input.value=query;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new KeyboardEvent('keyup',{bubbles:true,key:'Enter'}));}
});
</script>
