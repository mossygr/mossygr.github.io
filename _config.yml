webmaster_verifications:
  google: null
  bing: null
  alexa: null
  yandex: null
  baidu: null
  facebook: null
analytics:
  google:
    id: null
  goatcounter:
    id: null
  umami:
    id: null
    domain: null
  matomo:
    id: null
    domain: null
  cloudflare:
    id: null
  fathom:
    id: null
pageviews:
  provider: null
theme_mode: null
cdn: ''
avatar: /assets/img/sample/avatar.jpg
social_preview_image: null
toc: true
actions:
  edit_post:
    enabled: false
    url: ''
    static_url: false
comments:
  provider: null
  disqus:
    shortname: null
  utterances:
    repo: null
    issue_term: null
  giscus:
    repo: null
    repo_id: null
    category: null
    category_id: null
    mapping: null
    strict: null
    input_position: null
    lang: null
    reactions_enabled: null
assets:
  self_host:
    enabled: null
    env: null
pwa:
  enabled: false
  cache:
    enabled: false
    deny_paths:
    - /gym-app
paginate: 10
baseurl: ''
kramdown:
  footnote_backlink: '&#8617;&#xfe0e;'
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
collections:
  tabs:
    output: true
    sort_by: order
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    comments: true
    toc: true
    permalink: /posts/:title/
- scope:
    path: _drafts
  values:
    comments: false
- scope:
    path: ''
    type: tabs
  values:
    layout: page
    permalink: /:title/
- scope:
    path: assets/img/favicons
  values:
    swcache: true
- scope:
    path: assets/js/dist
  values:
    swcache: true
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
    - development
exclude:
- '*.gem'
- '*.gemspec'
- docs
- tools
- README.md
- LICENSE
- purgecss.js
- '*.config.js'
- package*.json
- templates
- AGENTS.md
- SITE_EDITING_GUIDE.md
- work-notes
- site-handoff
- .agents
- .codex
- .bundle
- vendor
- CHANGELOG.md
- rollup.config.js
- node_modules
- LICENSE.chirpy-7.6
jekyll-archives:
  enabled:
  - categories
  - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
